name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build IPA
        run: |
          xcodebuild -project Shiyi.xcodeproj -scheme Shiyi -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/Shiyi.app build/Payload/
          cd build
          zip -r Shiyi-ipa.zip Payload
          mv Shiyi-ipa.zip ../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shiyi-ipa
          path: Shiyi-ipa.zip
