<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拾壹 · 本地 Agent</title>
<style>
  :root {
    --bg: #F5F4F1; --card: #FFFFFF; --line: #E2E0DA;
    --text: #2C2C2A; --muted: #6B6A65; --hint: #9A9891;
    --blue: #185FA5; --blue-soft: #E6F1FB;
    --green: #3B6D11; --green-soft: #EAF3DE;
    --amber: #854F0B; --amber-soft: #FAEEDA;
    --red: #A32D2D; --red-soft: #FCEBEB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 14px;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 8px;
  }
  header .brand { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  header .sub { font-size: 11px; color: var(--muted); }
  header .spacer { flex: 1; }
  .pill {
    font-size: 12px; padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--line); color: var(--muted); background: var(--bg);
    cursor: pointer; white-space: nowrap; flex: none;
  }
  .pill:hover { border-color: #C9C7C0; }
  .pill.active {
    background: var(--green-soft); border-color: #C0DD97; color: var(--green);
  }
  .pill.danger { color: var(--red); }
  .pill.danger:hover { border-color: #F0A9A9; }
  #status { font-size: 12px; color: var(--green); flex: none; }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; flex-direction: column; gap: 6px; }
  .msg .who { font-size: 12px; color: var(--muted); }
  .bubble {
    padding: 10px 14px; border-radius: 12px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
  }
  .user .bubble { background: var(--blue-soft); border: 1px solid #B5D4F4; }
  .bot .bubble { background: var(--card); border: 1px solid var(--line); }
  .err .bubble { background: var(--red-soft); border: 1px solid #F7C1C1; color: var(--red); }
  .steps { display: flex; flex-direction: column; gap: 4px; }
  .step {
    font-size: 12px; padding: 6px 10px; border-radius: 8px;
    background: var(--green-soft); border: 1px solid #C0DD97; color: var(--green);
    font-family: ui-monospace, Consolas, monospace;
  }
  .step.result { background: var(--amber-soft); border-color: #FAC775; color: var(--amber); }
  .speakbar { text-align: right; margin-top: 2px; }
  .speakbtn {
    width: 36px; height: 32px; padding: 0; border-radius: 16px;
    background: var(--blue-soft); color: var(--blue); font-size: 14px;
    border: 1px solid #B5D4F4; cursor: pointer;
  }
  footer {
    background: var(--card); border-top: 1px solid var(--line);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
  }
  .inputbar { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  #btnMic {
    width: 44px; height: 44px; padding: 0; border-radius: 50%;
    background: var(--card); color: var(--text);
    border: 1px solid var(--line); flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  #btnMic.rec { background: var(--red); color: #fff; border-color: var(--red); }
  #btnMic.cancel { background: #8A8A85; color: #fff; border-color: #8A8A85; }
  textarea {
    flex: 1; resize: none; height: 44px; padding: 11px 14px; font: inherit;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
    color: var(--text); outline: none;
  }
  textarea:focus { border-color: var(--blue); background: var(--card); }
  button {
    padding: 0 20px; border: none; border-radius: 12px; background: var(--blue);
    color: #fff; font: inherit; cursor: pointer; height: 44px;
  }
  button:disabled { background: #B4B2A9; cursor: default; }
  .hint { font-size: 12px; color: var(--hint); text-align: center; margin-top: 8px; }
  .empty { text-align: center; color: var(--hint); padding: 60px 0; line-height: 2; }
  .empty code {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 2px 6px; font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1 id="whoTitle">拾壹</h1>
    <span class="sub" id="whoSub">总管 · 本地 Agent · 推理在本机 · 只监听本机</span>
  </div>
  <span class="spacer"></span>
  <span id="status"></span>
  <span class="pill" id="btnWho" title="切换对话对象：找拾贰（长工）直接说话">找拾贰干活</span>
  <span class="pill" id="btnCheck">检查模型</span>
  <span class="pill" id="btnGh" style="display:none" title="GitHub 接入状态">GitHub</span>
  <span class="pill" id="btnTools">工具</span>
  <span class="pill danger" id="btnReset">清空对话</span>
</header>

<main>
  <div class="wrap" id="log">
    <div class="empty">
      问点什么吧<br>
      <code>上证指数现在什么形态</code> <code>让拾贰整理工作区</code> <code>上海今天天气</code>
    </div>
  </div>
</main>

<footer>
  <div class="inputbar">
    <textarea id="input" placeholder="输入问题，回车发送（Shift+回车换行）"></textarea>
    <button id="btnMic" title="按住说话：按住开始录音，松开自动识别，上滑取消"></button>
    <button id="btnSend">发送</button>
  </div>
  <div class="hint">Enter 发送 · Shift+Enter 换行 · 推理在本机完成；天气/GitHub 等查询工具会联网，出站内容见审计日志</div>
</footer>

<script>
// 接口地址：打包进 APP 后网页从本地加载，必须用绝对地址访问电脑服务
const API = "http://172.16.2.89:8899";

const log = document.getElementById('log');
const input = document.getElementById('input');
const btnSend = document.getElementById('btnSend');
const statusEl = document.getElementById('status');
const btnWho = document.getElementById('btnWho');
const whoTitle = document.getElementById('whoTitle');
const whoSub = document.getElementById('whoSub');
let busy = false;
let mode = 'shiyi';   // 'shiyi' = 和拾壹聊（总管），'shier' = 直接和拾贰聊（长工）

function setMode(m) {
  mode = m;
  const isShier = m === 'shier';
  btnWho.classList.toggle('active', isShier);
  btnWho.textContent = isShier ? '找拾壹说话' : '找拾贰干活';
  whoTitle.textContent = isShier ? '拾贰' : '拾壹';
  whoSub.textContent = isShier
    ? '长工 · 干活专用 · 只有基础工具 · 无行情无派活权限'
    : '总管 · 本地 Agent · 推理在本机 · 只监听本机';
  input.placeholder = isShier
    ? '给拾贰派活或直接说话，回车发送（Shift+回车换行）'
    : '输入问题，回车发送（Shift+回车换行）';
}

btnWho.onclick = () => setMode(mode === 'shier' ? 'shiyi' : 'shier');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function addMsg(who, text, cls) {
  const box = el('div', 'msg ' + cls);
  box.appendChild(el('div', 'who', who));
  box.appendChild(el('div', 'bubble', text));
  log.appendChild(box);
  log.parentElement.scrollTop = log.parentElement.scrollHeight;
  return box;
}

function addSteps(box, steps) {
  if (!steps || !steps.length) return;
  const wrap = el('div', 'steps');
  steps.forEach(s => {
    const line = s.kind === 'tool'
      ? '调用 ' + s.name + ' ' + JSON.stringify(s.args)
      : '返回 ' + s.name + ' · ' + s.text.slice(0, 160).replace(/\n/g, ' ');
    wrap.appendChild(el('div', 'step' + (s.kind === 'result' ? ' result' : ''), line));
  });
  box.appendChild(wrap);
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  const empty = log.querySelector('.empty');
  if (empty) empty.remove();

  stopSpeak();  // 发送时打断朗读
  input.value = '';
  const whoName = mode === 'shier' ? '拾贰' : '拾壹';
  addMsg('你 → ' + whoName, text, 'user');
  busy = true; btnSend.disabled = true; btnSend.textContent = '思考中';

  const box = addMsg(whoName, '…', 'bot');
  const bubble = box.querySelector('.bubble');

  try {
    const res = await fetch(API + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, session_id: sessionId })
    });
    const data = await res.json();
    if (data.error) {
      bubble.textContent = data.error;
      box.className = 'msg err';
    } else {
      bubble.textContent = data.reply || '（空回答）';
      addSpeakBtn(box, data.reply);
      speakText(data.reply);  // 自动朗读回复
    }
  } catch (e) {
    bubble.textContent = '请求失败：' + e.message;
    box.className = 'msg err';
  } finally {
    busy = false; btnSend.disabled = false; btnSend.textContent = '发送';
    log.parentElement.scrollTop = log.parentElement.scrollHeight;
    input.focus();
  }
}

btnSend.onclick = send;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ---------- 会话管理：每轮带 session_id，记住上下文 ----------
let sessionId = localStorage.getItem('shiyi_session');
if (!sessionId) {
  sessionId = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  localStorage.setItem('shiyi_session', sessionId);
}

// ---------- 语音朗读：/tts 播放，支持打断 ----------
let ttsAudio = null;

function stopSpeak() {
  if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
}

async function speakText(text) {
  stopSpeak();
  if (!text) return;
  try {
    const res = await fetch(API + '/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text })
    });
    if (!res.ok) { statusEl.textContent = '朗读失败'; return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.onended = () => { URL.revokeObjectURL(url); if (ttsAudio === audio) ttsAudio = null; };
    audio.onerror = () => { statusEl.textContent = '朗读失败'; URL.revokeObjectURL(url); if (ttsAudio === audio) ttsAudio = null; };
    ttsAudio = audio;
    audio.play().catch(() => { /* 自动播放被拦则点喇叭 */ });
  } catch (e) {
    statusEl.textContent = '朗读失败：' + e.message;
  }
}

// 每条回复右侧加喇叭：点播放/再点停止
function addSpeakBtn(box, text) {
  const bar = el('div', 'speakbar');
  const btn = el('button', 'speakbtn', '🔊');
  btn.onclick = () => {
    if (ttsAudio) { stopSpeak(); btn.textContent = '🔊'; }
    else { speakText(text); btn.textContent = '⏹'; }
  };
  bar.appendChild(btn);
  box.appendChild(bar);
}

// ---------- 启动时健康检查 ----------
(async () => {
  try {
    const r = await fetch(API + '/health', { method: 'GET' });
    const d = await r.json();
    if (d.status === 'ok') statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = '无法连接本机服务';
  }
})();

// ---------- 语音识别（本地 FunASR，不走云端） ----------
const btnMic = document.getElementById('btnMic');
const MIC_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>';
const X_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
btnMic.innerHTML = MIC_SVG;
let mediaRecorder = null;
let audioChunks = [];
let recognizing = false;
let audioCtx = null;
let skipUpload = false;

// iOS 壳内：按钮桥接原生录音；普通浏览器：网页 MediaRecorder
const hasNativeVoice = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.voice);
let micActive = false;
let micCancel = false;
let micStartY = 0;
const CANCEL_OFFSET = 60;  // 上滑超过 60px 松开即取消

function micDown(e) {
  micActive = true; micCancel = false; micStartY = e.clientY;
  btnMic.classList.add('rec');
  if (hasNativeVoice) {
    window.webkit.messageHandlers.voice.postMessage('down');
    return;
  }
  if (recognizing) return;
  startRecording().catch((err) => {
    statusEl.textContent = '无法录音：' + err.message;
    recognizing = false;
    btnMic.classList.remove('rec');
    micActive = false;
  });
}
function micMove(e) {
  if (!micActive) return;
  if (e.clientY < micStartY - CANCEL_OFFSET) {
    if (!micCancel) { micCancel = true; btnMic.innerHTML = X_SVG; btnMic.classList.add('cancel'); }
  } else {
    if (micCancel) { micCancel = false; btnMic.innerHTML = MIC_SVG; btnMic.classList.remove('cancel'); }
  }
}
function micUp() {
  if (!micActive) return;
  micActive = false;
  btnMic.classList.remove('rec', 'cancel');
  btnMic.innerHTML = MIC_SVG;
  if (hasNativeVoice) {
    window.webkit.messageHandlers.voice.postMessage(micCancel ? 'cancel' : 'up');
    micCancel = false;
    return;
  }
  if (micCancel) {
    micCancel = false;
    if (recognizing && mediaRecorder) { skipUpload = true; mediaRecorder.stop(); }
    return;
  }
  if (recognizing && mediaRecorder) { mediaRecorder.stop(); }
}
btnMic.addEventListener('pointerdown', (e) => { e.preventDefault(); micDown(e); });
btnMic.addEventListener('pointermove', micMove);
btnMic.addEventListener('pointerup', micUp);
btnMic.addEventListener('pointercancel', micUp);
btnMic.addEventListener('pointerleave', micUp);

function to16k(samples, fromRate) {
  if (fromRate === 16000) return samples;
  const ratio = fromRate / 16000;
  const out = new Float32Array(Math.round(samples.length / ratio));
  for (let i = 0; i < out.length; i++) out[i] = samples[Math.floor(i * ratio)];
  return out;
}

function pcm16(view, offset, samples) {
  for (let i = 0; i < samples.length; i++, offset += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
}

function encodeWav(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, samples.length * 2, true);
  pcm16(v, 44, samples);
  return buf;
}

async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  mediaRecorder = new MediaRecorder(stream);
  audioChunks = [];
  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    if (skipUpload) {  // 上滑取消：丢弃本次录音
      skipUpload = false;
      recognizing = false;
      btnMic.classList.remove('rec');
      return;
    }
    try {
      statusEl.textContent = '识别中…';
      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuf = await audioCtx.decodeAudioData(await blob.arrayBuffer());
      const mono = audioBuf.getChannelData(0);
      const samples = to16k(mono, audioBuf.sampleRate);
      const wav = encodeWav(samples, 16000);
      const resp = await fetch(API + '/asr', {
        method: 'POST',
        headers: { 'Content-Type': 'audio/wav' },
        body: new Blob([wav], { type: 'audio/wav' }),
      });
      const data = await resp.json();
      if (data.text) {
        input.value = data.text;
        statusEl.textContent = '';
        input.focus();
        send();  // 识别后自动发给拾壹（主链路：说→识别→回→朗读）
      } else if (data.error) {
        statusEl.textContent = data.error;
      } else {
        statusEl.textContent = '未识别到语音';
      }
    } catch (err) {
      statusEl.textContent = '识别失败：' + err.message;
    }
    btnMic.classList.remove('rec');
    recognizing = false;
  };
  mediaRecorder.start();
  recognizing = true;
  btnMic.classList.add('rec');
}

// （按住说话事件绑定已在上方统一处理）

document.getElementById('btnReset').onclick = async () => {
  await fetch(API + '/api/reset', { method: 'POST' });
  // 换新会话：上下文清零
  sessionId = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  localStorage.setItem('shiyi_session', sessionId);
  log.innerHTML = '<div class="empty">对话已清空</div>';
};

document.getElementById('btnTools').onclick = async () => {
  const res = await fetch(API + '/api/tools');
  const data = await res.json();
  const empty = log.querySelector('.empty');
  if (empty) empty.remove();
  addMsg('已注册工具 ' + data.count + ' 个', data.catalog, 'bot');
};

document.getElementById('btnCheck').onclick = async () => {
  statusEl.textContent = '检测中…';
  try {
    const res = await fetch(API + '/api/check');
    const data = await res.json();
    statusEl.textContent = (data.ok ? '模型已连通' : '模型未连通') + ' · ' + data.info;
    statusEl.style.color = data.ok ? '#3B6D11' : '#A32D2D';
  } catch (e) {
    statusEl.textContent = '检测失败';
  }
};

input.focus();

// 启动时探一次后端：工具总数 + GitHub 是否接上。
// 不这么做的话，界面上完全没有「GitHub 连上了」的痕迹——只有点开「工具」
// 看到一堆工具名，用户没法确认状态。
let ghCache = null;
(async () => {
  try {
    const res = await fetch(API + '/api/tools');
    const d = await res.json();
    ghCache = d.github || {};
    if (d.offline) {
      const b = document.getElementById('btnGh');
      b.style.display = '';
      b.textContent = '离线模式';
      b.title = 'weather/github 未注册，程序内无出站通道，数据不出本机。要联网改 config.json 的 tools.offline=false 后重启。';
    } else if (ghCache.on) {
      const b = document.getElementById('btnGh');
      b.style.display = '';
      b.classList.add('active');
      b.textContent = ghCache.token ? 'GitHub 已接入' : 'GitHub · 匿名';
      b.title = ghCache.token
        ? 'token 已配置，每小时 5000 次请求'
        : '未配 token：每小时 60 次，代码搜索不可用';
    }
    statusEl.textContent = d.count + ' 个工具就绪';
    statusEl.style.color = '#3B6D11';
  } catch (e) {
    statusEl.textContent = '后端未响应';
    statusEl.style.color = '#A32D2D';
  }
})();

document.getElementById('btnGh').onclick = () => {
  if (!ghCache) return;
  const lines = [
    'github_search  搜仓库 / 代码 / issue / 用户',
    'github_repo    看仓库概况、README，或读仓库里的文件',
    'github_issues  列 issue 和 PR，给编号看单条正文',
  ];
  if (ghCache.write) lines.push('github_comment 在 issue 下发评论（已开启，会真实发出）');
  const state = ghCache.token
    ? 'token 已配置，每小时 5000 次请求。'
    : '未配 token：匿名每小时只有 60 次，且代码搜索（kind=code）不可用。\n'
      + '要配就把 token 填进 config.json 的 tools.github.token。';
  addMsg('GitHub 接入状态', state + '\n\n' + lines.join('\n'), 'bot');
};
</script>
</body>
</html>
