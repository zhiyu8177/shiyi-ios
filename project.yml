name: Shiyi
options:
  bundleIdPrefix: com.shiyi
  deploymentTarget:
    iOS: "14.0"
targets:
  Shiyi:
    type: application
    platform: iOS
    sources:
      - path: Shiyi
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiyi.app
        PRODUCT_NAME: Shiyi
        INFOPLIST_FILE: Shiyi/Info.plist
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
